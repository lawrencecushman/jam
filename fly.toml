app = "jam-ws"
primary_region = "sjc"

[build]

[env]
HOST = "0.0.0.0"
PORT = "8080"
YPERSISTENCE = "/data/db"

[mounts]
source = "jam_ws_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
