<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 4x4 step sequencer grid, some steps lit in emerald -->
  <!-- Row 1 -->
  <rect x="1"  y="1"  width="6" height="6" rx="1" fill="#34d399"/>
  <rect x="9"  y="1"  width="6" height="6" rx="1" fill="#27272a"/>
  <rect x="17" y="1"  width="6" height="6" rx="1" fill="#34d399"/>
  <rect x="25" y="1"  width="6" height="6" rx="1" fill="#27272a"/>
  <!-- Row 2 -->
  <rect x="1"  y="9"  width="6" height="6" rx="1" fill="#27272a"/>
  <rect x="9"  y="9"  width="6" height="6" rx="1" fill="#34d399"/>
  <rect x="17" y="9"  width="6" height="6" rx="1" fill="#27272a"/>
  <rect x="25" y="9"  width="6" height="6" rx="1" fill="#34d399"/>
  <!-- Row 3 -->
  <rect x="1"  y="17" width="6" height="6" rx="1" fill="#34d399"/>
  <rect x="9"  y="17" width="6" height="6" rx="1" fill="#27272a"/>
  <rect x="17" y="17" width="6" height="6" rx="1" fill="#27272a"/>
  <rect x="25" y="17" width="6" height="6" rx="1" fill="#34d399"/>
  <!-- Row 4 -->
  <rect x="1"  y="25" width="6" height="6" rx="1" fill="#27272a"/>
  <rect x="9"  y="25" width="6" height="6" rx="1" fill="#34d399"/>
  <rect x="17" y="25" width="6" height="6" rx="1" fill="#34d399"/>
  <rect x="25" y="25" width="6" height="6" rx="1" fill="#27272a"/>
</svg>
